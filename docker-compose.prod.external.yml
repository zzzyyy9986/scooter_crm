# Docker Compose для VPS с Nginx на хосте.
# MySQL — в отдельном контейнере (порт 3306 НЕ пробрасывается на хост,
# системный MySQL на сервере не затрагивается).
# Nginx на хосте проксирует / → frontend, /api → backend (nginx/host.conf.example).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scooter_crm}
      MYSQL_USER: ${MYSQL_USER:-scooter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Scooter CRM}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-scooter_crm}
      DB_USERNAME: ${MYSQL_USER:-scooter}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    depends_on:
      mysql:
        condition: service_healthy

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_ADMINER_URL: /adminer/
        VITE_ADMINER_DB_USER: ${MYSQL_USER:-scooter}
        VITE_ADMINER_DB_NAME: ${MYSQL_DATABASE:-scooter_crm}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
