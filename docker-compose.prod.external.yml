# Docker Compose для VPS, где MySQL и Nginx уже установлены на хосте.
# Backend и frontend — в контейнерах, порты только на 127.0.0.1.
# Nginx на хосте проксирует / → frontend, /api → backend (см. nginx/host.conf.example).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    network_mode: host
    environment:
      APP_NAME: ${APP_NAME:-Scooter CRM}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${MYSQL_DATABASE:-scooter_crm}
      DB_USERNAME: ${MYSQL_USER:-scooter}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    command:
      - sh
      - -c
      - >
        php artisan migrate --force &&
        if [ "$$SEED_DATABASE" = "true" ]; then php artisan db:seed --force; fi &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan serve --host=127.0.0.1 --port=${BACKEND_PORT:-8000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
